
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create A Jumia Account</title>
    <link rel="stylesheet" href="accountcreation.css">
</head>
<body>

    <img class="creation-logo" src="Assets/creationlogo.png" alt="">

    <div class="welcome">
        <h4>Welcome to Jumia</h4>
        <p>Use your email or phone to log in or sign up.</p>
    </div>

    <form class="Email-Form">
        <input type="email" placeholder="Enter E-mail Address or Phone Number">
        <button type="submit">Continue</button>
    </form>

    <p class="login-text">Or log in with</p>

    <div class="logos">
        <img class="facebook" src="https://tse1.mm.bing.net/th/id/OIP.N24RC8dLPtIGYfPSlKsK7AHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Facebook">
        <img class="google" src="https://freelogopng.com/images/all_img/1657952440google-logo-png-transparent.png" alt="Google">
    </div>

    <div class="terms">
        <p>By continuing you agree to Jumia’s</p>
        <div>
            <a href="https://my.jumia.com.ng/interaction/5m3_ihKdxo1JSLzSnZF8HibXH-V578wDpwLoZ5Oc2jE/en-ng/terms-and-conditions">Terms and Conditions</a>
            <a href="https://www.jumia.com.ng/sp-privacy/">Privacy Policy</a>
        </div>
    </div>

    <p class="help">Need help? Visit our Help Center or contact us on 02018881106</p>

    <img class="jumia-logo" src="Assets/logo_jumia.svg" alt="Jumia">

</body>
</html>
